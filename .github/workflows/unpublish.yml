name: Unpublish a version
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to unpublish (e.g. 0.1.0)"
        required: true

permissions:
  contents: read

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Unpublish
        run: npm unpublish @yaotoshi/pinokio-sdk@${{ inputs.version }} --force
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
